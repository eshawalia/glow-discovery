<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="glow_discovery.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - Saved</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>

<body> 
    <div class="main-container"> 
        <div class="header-content">
            <h1>My Library</h1>
            <div class="tab-filter">
                <a href="library.html" class="tab-button">Library</a> 
                <a href="saved.html" class="tab-button active">Saved</a> 
            </div>
        </div>

        <div class="section">
            <div class="search-filter-container">

                <form class="search-bar" role="search">
                    <img src="images/search_icon.svg" alt="Search icon.">
                    <input  type="text" inputmode="search" enterkeyhint="search" 
                            placeholder="Search products or brands..."
                            aria-label="Search products or brands">
                    <button class="clear-button" aria-label="Clear search">
                        <img src="images/cross_icon.svg" alt="Cross icon.">
                    </button>
                </form>

                <a href="" class="filter-button" aria-label="Filter button.">
                    <img src="images/filter_icon.svg" alt="Filter icon.">
                </a>
            </div>

            <div class="library-results">
                    <p class="results-count">0 Products</p>
                    <a href="" class="sort-by-filter" aria-label="Sort by most recent filter">
                        Most Recent <img src="images/down_arrow.svg" alt="Drop-down arrow icon.">
                    </a>

            </div>

            <div class="saved-empty">
                <img src="images/saved_empty_icon.svg" alt="Save icon representing no saved products.">
                <h2>No Saved Products</h2>
                <p class="saved-empty-text">Save recommendations from Insights to review later</p>
            </div>
        </div>

        <div class="nav-bar"> 
            <nav>
                <a href="index.html" class="nav-button"><img src="images/home_icon.svg" alt="Home button icon.">Home</a>
                <a href="library.html" class="nav-button selected"><img src="images/library_selected_icon.svg" alt="Library button icon.">Library</a>
                <a href="" class="add-button">
                    <img src="images/add_icon.svg"  alt="Add product button.">
                Add</a>
                <a href="insights.html" class="nav-button"><img src="images/insights_icon.svg" alt="Insights button icon.">Insights</a>
                <a href="" class="nav-button"><img src="images/profile_icon.svg" alt="Profile button icon.">Profile</a>
            </nav>
        </div>

        
    </div>
</body>
</html>
